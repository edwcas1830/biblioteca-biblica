# Biblioteca Bíblica: APK de prueba para Android.
# Solo corre por un acto deliberado: «Run workflow» (workflow_dispatch) o un push a la rama
# android-apk, que nadie empuja sin el «sí» de Edward. Usa el Android SDK preinstalado en el
# runner, lo que implica aceptar las condiciones del Android SDK: Edward lo autoriza con ese «sí».
# (GitHub solo muestra «Run workflow» si el archivo está en main; la rama android-apk evita tocar main.)
# Nunca incluye módulos personales: la auditoría falla si el APK trae .bblx/.cmtx/.dctx/.sqlite.
#
# Para activarlo: copiar este archivo a .github/workflows/android.yml (hoy .github/ está en
# .gitignore del repo; hay que quitar esa línea), crear la rama android-apk y empujarla.
name: APK Android

on:
  push:
    branches: [android-apk]
  workflow_dispatch:
    inputs:
      rama:
        description: Rama a compilar
        type: choice
        options: [android-apk, android-ui]
        default: android-apk

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      # Desde el 15-oct el emulador se caía a mitad de la prueba («device not found»), también con el código que pasó
      # el 13-oct: la imagen nueva trae menos disco libre (mismo síntoma en pybind11#5914). Se libera lo que no usamos.
      - name: Liberar disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium || true
          sudo docker system prune -a -f > /dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rama || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle  # evita bajar todo de Maven Central en cada vuelta (429 Too Many Requests)

      - name: Dependencias de la app común
        run: npm ci

      - name: Biblia RV1909 y lectores locales
        run: |
          npm run bible
          npm run prepare:assets

      - name: Pruebas compartidas (escritorio y teléfono)
        run: npm test

      - name: Dependencias móviles
        working-directory: mobile
        run: npm ci

      - name: Armar www y sincronizar con Android
        working-directory: mobile
        run: |
          node scripts/build-www.cjs
          node scripts/probar-arranque-android.cjs
          npx cap sync android

      - name: Compilar APK final (firma fija de Edward) y el de depuración solo para las pruebas
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: biblioteca  # nombre de la llave: no es secreto (como secreto, GitHub tachaba «biblioteca» en los registros)
          BIBLIOTECA_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/biblioteca-biblica.p12"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/biblioteca-biblica.p12"
          else
            echo "::warning::Sin la llave fija: el APK sale con la firma de depuración y no se instalará encima"
          fi
          export BIBLIOTECA_VERSION_NAME="$(node -p "require('../package.json').version")"
          ./gradlew --no-daemon assembleDebug assembleRelease
          rm -f "$RUNNER_TEMP/biblioteca-biblica.p12"

      - name: Comprobar el APK final (firma fija y no depurable)
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --print-certs "$APK" | tee firma.txt
          grep -qi 'SHA-256 digest: 31bdb8bbe54f57dc806108e5cdc60573b76f2df5d4ff09419ed09ba3993b07e4' firma.txt
          if "$TOOLS/aapt2" dump badging "$APK" | grep -q 'application-debuggable'; then
            echo "El APK final es depurable"; exit 1
          fi

      - name: Auditoría del APK (nada privado)
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" > lista.txt
          if grep -Ei '\.(bblx|cmtx|dctx|bbli|cmti|dcti|sqlite|sqlite3|db)$' lista.txt; then
            echo "El APK trae archivos prohibidos"; exit 1
          fi
          if grep -E 'assets/public/music/' lista.txt; then
            echo "El APK trae el reproductor intermedio de música (debe ir directo a YouTube)"; exit 1
          fi
          sha256sum "$APK" | tee apk.sha256
          ls -la "$APK"

      - name: Edición tienda (Google Play) para ver cómo se vería
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: biblioteca
          BIBLIOTECA_VERSION_CODE: ${{ github.run_number }}
        run: |
          SALIDA=android/app/build/outputs/apk
          cp "$SALIDA/release/app-release.apk" "$RUNNER_TEMP/completa-release.apk"
          cp "$SALIDA/debug/app-debug.apk" "$RUNNER_TEMP/completa-debug.apk"
          BIBLIA_EDICION=tienda node scripts/build-www.cjs
          npx cap sync android
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/biblioteca-biblica.p12"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/biblioteca-biblica.p12"
          fi
          export BIBLIOTECA_VERSION_NAME="$(node -p "require('./package.json').version")-tienda"
          (cd android && BIBLIOTECA_APP_ID=com.castillodigital.bibliotecabiblica BIBLIOTECA_APP_NAME="Biblioteca Play" ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease)
          rm -f "$RUNNER_TEMP/biblioteca-biblica.p12"
          mkdir -p "$GITHUB_WORKSPACE/apk-tienda"
          cp "$SALIDA/release/app-release.apk" "$GITHUB_WORKSPACE/apk-tienda/biblioteca-tienda.apk"
          cp "$SALIDA/debug/app-debug.apk" "$GITHUB_WORKSPACE/apk-tienda/biblioteca-tienda-depuracion.apk"
          # AAB para Google Play (prueba del formato; la subida final irá firmada con la clave de subida nueva).
          cp android/app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/apk-tienda/biblioteca-tienda.aab"
          unzip -l "$GITHUB_WORKSPACE/apk-tienda/biblioteca-tienda.aab" | grep -q "base/manifest/AndroidManifest.xml"
          ls -la "$GITHUB_WORKSPACE/apk-tienda/"
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$TOOLS/aapt2" dump badging "$GITHUB_WORKSPACE/apk-tienda/biblioteca-tienda.apk" | grep -E "^package: name='com.castillodigital.bibliotecabiblica'"
          if "$TOOLS/aapt2" dump badging "$GITHUB_WORKSPACE/apk-tienda/biblioteca-tienda.apk" | grep -q 'application-debuggable'; then echo "La tienda salió depurable"; exit 1; fi
          # Vuelve la edición completa (las pruebas siguientes y el APK entregado son la completa).
          cp "$RUNNER_TEMP/completa-release.apk" "$SALIDA/release/app-release.apk"
          cp "$RUNNER_TEMP/completa-debug.apk" "$SALIDA/debug/app-debug.apk"
          node scripts/build-www.cjs
          npx cap sync android

      # ---------- Prueba del APK real en un emulador Android, antes de entregarlo ----------
      - name: Carpeta de traspaso sintética (datos inventados)
        run: |
          node mobile/scripts/fixture-traspaso.cjs "$RUNNER_TEMP/fixture-traspaso"
          node mobile/scripts/empaquetar-traspaso.cjs "$RUNNER_TEMP/fixture-traspaso/traspaso" "$RUNNER_TEMP/fixture-traspaso/prueba.bbt"
          node mobile/scripts/probar-arranque-android.cjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/fixture-traspaso/prueba.bbt"

      - name: Habilitar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Anfitriones AMD (15-oct): Android escribe registros MSR que KVM no maneja («Unhandled WRMSR(0xc0010007)»
          # en dmesg) y el emulador se cae. Que KVM los ignore en vez de devolver error al sistema invitado.
          echo 1 | sudo tee /sys/module/kvm/parameters/ignore_msrs
          echo 0 | sudo tee /sys/module/kvm/parameters/report_ignored_msrs || true

      # Los compiladores de Gradle y Kotlin quedan vivos tras el AAB y le quitan memoria al emulador (se caía, 15-oct).
      - name: Liberar memoria antes del emulador
        run: |
          pkill -f KotlinCompileDaemon || true
          pkill -f GradleDaemon || true
          pkill -f GradleWorkerMain || true
          free -m
          df -h /

      # Android 15: desde el 15-oct la imagen de Android 14 hace caer el emulador a mitad de la prueba (también con el
      # código que pasó el 13-oct, en ubuntu 24.04 y 22.04).
      - name: Probar la app en Android 15 (emulador)
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            echo "== prueba en emulador: inicio =="
            node mobile/scripts/probar-en-emulador.cjs mobile/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/fixture-traspaso/traspaso" "$GITHUB_WORKSPACE/prueba-emulador" "$RUNNER_TEMP/fixture-traspaso/prueba.bbt"
            node mobile/scripts/comprobar-version-final.cjs mobile/android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/prueba-emulador"
            node mobile/scripts/vista-tienda.cjs apk-tienda/biblioteca-tienda-depuracion.apk "$GITHUB_WORKSPACE/prueba-emulador"
            ls -la "$GITHUB_WORKSPACE/prueba-emulador"

      - name: Comprobar el informe del emulador (sin informe completo no hay APK)
        run: |
          test -f prueba-emulador/informe.txt
          cat prueba-emulador/informe.txt
          grep -q "^OK  Gemini sigue conectado tras actualizar" prueba-emulador/informe.txt
          grep -q "^OK  versión final no depurable" prueba-emulador/informe.txt
          grep -q "^OK  versión final no registra llamadas a plugins" prueba-emulador/informe.txt
          grep -q "^OK  tienda: sin IA, música, traspaso, círculo ni importar módulos" prueba-emulador/informe.txt
          grep -q "^OK  tienda: diccionarios griego y hebreo en español (Sociedades Bíblicas)" prueba-emulador/informe.txt
          grep -q "^OK  tienda: Plus (vista previa)" prueba-emulador/informe.txt
          grep -q "^OK  paso 1: barra superior de una fila" prueba-emulador/informe.txt
          grep -q "^OK  Strong y escuchar a la vista, se minimiza y vuelve" prueba-emulador/informe.txt
          grep -q "^OK  paso 1: «rey» sugiere 1 Reyes y 2 Reyes" prueba-emulador/informe.txt
          grep -q "^OK  paso 1 con letra al 200 %: nada se sale ni se corta" prueba-emulador/informe.txt
          grep -q "^OK  paso 2: pestañas abajo, una cosa a la vez a pantalla completa" prueba-emulador/informe.txt
          grep -q "^OK  paso 3: acciones del versículo y elegir varios (Juan 3:16-18)" prueba-emulador/informe.txt
          grep -q "^OK  la palabra elegida sigue al cambiar de diccionario" prueba-emulador/informe.txt
          grep -q "^OK  palabra con original (RV1960): el diccionario la recibe y no la pierde" prueba-emulador/informe.txt
          grep -q "^OK  paso 4: Mi estudio guarda marcadores, etiquetas, memoria, colores e historial" prueba-emulador/informe.txt
          grep -q "^OK  entrega 1: las 6 pestañas fijas con icono, sin deslizar ni cortarse" prueba-emulador/informe.txt
          grep -q "^OK  entrega 1: el pie dice adónde vas y no tapa el texto" prueba-emulador/informe.txt
          grep -q "^OK  entrega 1: ningún emoji en la barra, el menú ni las pestañas" prueba-emulador/informe.txt
          grep -q "^OK  entrega 1: voz y velocidad en el menú y Detener a la vista" prueba-emulador/informe.txt
          grep -q "^OK  entrega 1: Comentario con fichas, un solo selector y nunca vacío" prueba-emulador/informe.txt
          grep -q "^OK  entrega 1: guardar copia en el teléfono y recuperarla (vuelve la nota borrada)" prueba-emulador/informe.txt
          grep -q "^OK  entrega 2: la lectura sigue en segundo plano con controles y termina el capítulo" prueba-emulador/informe.txt
          grep -q "^OK  entrega 1 con letra al 200 %: los nombres de las pestañas se siguen viendo" prueba-emulador/informe.txt

      # Diagnóstico si el emulador se cae (15-oct): registro del sistema del anfitrión y datos del choque del emulador.
      - name: Diagnóstico del emulador
        if: failure()
        run: |
          mkdir -p prueba-emulador/diagnostico
          sudo dmesg | tail -200 > prueba-emulador/diagnostico/dmesg.txt || true
          free -m > prueba-emulador/diagnostico/memoria.txt; df -h / >> prueba-emulador/diagnostico/memoria.txt
          cp -r /tmp/android-runner prueba-emulador/diagnostico/ 2>/dev/null || true
          find "$HOME/.android" -name "*.log" -exec cp {} prueba-emulador/diagnostico/ \; 2>/dev/null || true
          grep -iE "oom|killed|qemu|emulator|segfault|kvm" prueba-emulador/diagnostico/dmesg.txt | tail -40 || true

      - name: Resultados de la prueba en el emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-emulador
          path: prueba-emulador/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: biblioteca-biblica-android
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            apk-tienda/biblioteca-tienda.apk
            apk-tienda/biblioteca-tienda.aab
            apk.sha256
            mobile/www-auditoria.json
          retention-days: 14

  # Edición web para iPhone en WebKit (motor de Safari): arranque, CSP y cifrado cruzado con Node.
  web-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rama || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependencias y Biblia
        run: |
          npm ci
          npm run bible
          npm run prepare:assets

      - name: Armar la edición web
        working-directory: mobile
        env:
          BIBLIA_EDICION: web
        run: |
          npm ci
          node scripts/build-www.cjs

      - name: WebKit
        working-directory: mobile
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps webkit
          node scripts/probar-web-webkit.cjs

      - name: Captura si WebKit falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-webkit
          path: mobile/prueba-webkit/
          retention-days: 7

  # Migraciones del chat (_bb) en un Postgres desechable que imita lo mínimo de Supabase.
  # Nunca toca el proyecto real: cada prueba termina con un error a propósito y todo se deshace.
  servidor-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: prueba
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: prueba
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rama || github.ref }}

      - name: Pruebas de 001 y 003
        working-directory: servidor/supabase
        run: |
          probar() { # base, archivos…
            local base=$1; shift
            createdb "$base"
            psql -q -d "$base" -v ON_ERROR_STOP=1 -f ci/supabase_minimo.sql
            local args=(); for f in "$@"; do args+=(-f "$f"); done
            psql -q -d "$base" -1 "${args[@]}" > "salida-$base.txt" 2>&1 || true
            sed -n '/INFORME/,$p' "salida-$base.txt"
            grep -q "INFORME" "salida-$base.txt" || { cat "salida-$base.txt"; return 1; }
            ! grep -q "FALLA" "salida-$base.txt"
          }
          probar uno 001_foro_bb.sql 002_proyecto_compartido.sql prueba_001_foro_bb.sql
          probar dos 001_foro_bb.sql 002_proyecto_compartido.sql 003_foro_bb.sql prueba_003_foro_bb.sql
          # 003 se aplica limpio sobre 001+002 (como se aplicaría en el proyecto real).
          createdb tres
          psql -q -d tres -v ON_ERROR_STOP=1 -f ci/supabase_minimo.sql -f 001_foro_bb.sql -f 002_proyecto_compartido.sql -1 -f 003_foro_bb.sql
          echo "003 aplica limpio"
